apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-mcp-server
  labels:
    app: test-mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-mcp-server
  template:
    metadata:
      labels:
        app: test-mcp-server
    spec:
      containers:
        - name: test-mcp-server
          image: quay.io/wanaku/test-mcp-server:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8181
          env:
            - name: QUARKUS_HTTP_PORT
              value: "8181"
            - name: QUARKUS_HTTP_HOST
              value: "0.0.0.0"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: test-mcp-server
  labels:
    app: test-mcp-server
spec:
  selector:
    app: test-mcp-server
  ports:
    - name: http
      port: 8181
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test-mcp-server
  labels:
    app: test-mcp-server
spec:
  rules:
    - host: __TEST_MCP_SERVER_HOST__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: test-mcp-server
                port:
                  number: 8181
  tls:
    - {}

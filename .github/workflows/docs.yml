name: Docs

on:
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - '.markdownlint-cli2.yaml'
      - '.lycheeignore'
      - '.github/check-docs.py'
      - '.github/workflows/docs.yml'
  pull_request:
    branches:
      - main
    paths:
      - '**/*.md'
      - '.markdownlint-cli2.yaml'
      - '.lycheeignore'
      - '.github/check-docs.py'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --include-fragments
            --exclude-path .claude
            --exclude-path .bob
            --exclude-path .specify
            --exclude-path specs
            --exclude-path target
            '**/*.md'
          fail: true

  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@8de2aa07cae85fd17c0b35642db70cf5495f1d25 # v24.0.0

  docs-conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the docs conventions
        run: python3 .github/check-docs.py

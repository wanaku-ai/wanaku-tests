name: Test MCP Server Container

on:
  pull_request:
    paths:
      - fixtures/test-mcp-server/**
      - .github/workflows/fixture-container.yml
  push:
    branches: [main]
    paths:
      - fixtures/test-mcp-server/**
      - .github/workflows/fixture-container.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: quay.io/wanaku/test-mcp-server

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            architecture: amd64
            platform: linux/amd64
          - os: ubuntu-24.04-arm
            architecture: arm64
            platform: linux/arm64/v8
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: fixtures/test-mcp-server/pom.xml
      - name: Login to Container Registry
        if: github.event_name != 'pull_request' && github.repository == 'wanaku-ai/wanaku-tests' && github.ref == 'refs/heads/main'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - name: Build container
        working-directory: fixtures/test-mcp-server
        env:
          PUSH_IMAGE: ${{ github.event_name != 'pull_request' && github.repository == 'wanaku-ai/wanaku-tests' && github.ref == 'refs/heads/main' }}
          IMAGE_TAG: sha-${{ github.sha }}-${{ matrix.architecture }}
        run: |
          ./mvnw --batch-mode --no-transfer-progress clean verify \
            -Dquarkus.container-image.build=true \
            -Dquarkus.container-image.push="$PUSH_IMAGE" \
            -Dquarkus.container-image.registry=quay.io \
            -Dquarkus.container-image.group=wanaku \
            -Dquarkus.container-image.name=test-mcp-server \
            -Dquarkus.container-image.tag="$IMAGE_TAG" \
            -Dquarkus.jib.platforms="${{ matrix.platform }}"

  create-manifests:
    if: github.event_name != 'pull_request' && github.repository == 'wanaku-ai/wanaku-tests' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login to Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - name: Create and verify multi-architecture manifests
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: bash ./build-manifests.sh "$IMAGE" "$IMAGE_TAG"

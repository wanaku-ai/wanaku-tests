name: Full Integration Test (From Source)

on:
  workflow_dispatch:
    inputs:
      wanaku_repo:
        description: 'Wanaku repository (owner/repo)'
        required: false
        default: 'wanaku-ai/wanaku'
      wanaku_branch:
        description: 'Wanaku branch'
        required: false
        default: 'main'
      sdk_repo:
        description: 'SDK repository (owner/repo)'
        required: false
        default: 'wanaku-ai/wanaku-capabilities-java-sdk'
      sdk_branch:
        description: 'SDK branch'
        required: false
        default: 'main'
      cic_repo:
        description: 'Camel Integration Capability repository (owner/repo)'
        required: false
        default: 'wanaku-ai/camel-integration-capability'
      cic_branch:
        description: 'Camel Integration Capability branch'
        required: false
        default: 'main'
      barn_repo:
        description: 'Wanaku Barn repository (owner/repo)'
        required: false
        default: 'wanaku-ai/wanaku-barn'
      barn_branch:
        description: 'Wanaku Barn branch'
        required: false
        default: 'main'
      pr_number:
        description: 'PR number to comment results on (empty = skip commenting)'
        required: false
        default: ''
      source_repo:
        description: 'Source repository for PR comment (owner/repo)'
        required: false
        default: 'wanaku-ai/wanaku'

permissions:
  contents: read

jobs:
  full-integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WANAKU_REPO: ${{ inputs.wanaku_repo }}
      WANAKU_BRANCH: ${{ inputs.wanaku_branch }}
      SDK_REPO: ${{ inputs.sdk_repo }}
      SDK_BRANCH: ${{ inputs.sdk_branch }}
      CIC_REPO: ${{ inputs.cic_repo }}
      CIC_BRANCH: ${{ inputs.cic_branch }}
      BARN_REPO: ${{ inputs.barn_repo }}
      BARN_BRANCH: ${{ inputs.barn_branch }}
      PR_NUMBER: ${{ inputs.pr_number }}
      SOURCE_REPO: ${{ inputs.source_repo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Install cargo-component
        run: |
          cargo install cargo-component

      - name: Clone sources
        run: |
          mkdir -p source

          echo "::group::Cloning SDK (${SDK_REPO}@${SDK_BRANCH})"
          git clone --depth 1 --branch "${SDK_BRANCH}" \
            "https://github.com/${SDK_REPO}.git" source/wanaku-sdk
          echo "::endgroup::"

          echo "::group::Cloning Wanaku (${WANAKU_REPO}@${WANAKU_BRANCH})"
          git clone --depth 1 --branch "${WANAKU_BRANCH}" \
            "https://github.com/${WANAKU_REPO}.git" source/wanaku
          echo "::endgroup::"

          echo "::group::Cloning CIC (${CIC_REPO}@${CIC_BRANCH})"
          git clone --depth 1 --branch "${CIC_BRANCH}" \
            "https://github.com/${CIC_REPO}.git" source/camel-integration-capability
          echo "::endgroup::"

          echo "::group::Cloning Barn (${BARN_REPO}@${BARN_BRANCH})"
          git clone --depth 1 --branch "${BARN_BRANCH}" \
            "https://github.com/${BARN_REPO}.git" source/wanaku-barn
          echo "::endgroup::"

      - name: Cache Cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ hashFiles('source/wanaku/Cargo.lock') }}
          restore-keys: |
            cargo-registry-

      - name: Cache Rust target directory
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: source/wanaku/target
          key: cargo-target-${{ runner.os }}-${{ hashFiles('source/wanaku/Cargo.lock') }}
          restore-keys: |
            cargo-target-${{ runner.os }}-

      - name: Build sources summary
        run: |
          {
            echo "## Build Configuration"
            echo ""
            echo "| Component | Repository | Branch |"
            echo "|-----------|-----------|--------|"
            echo "| SDK | \`${SDK_REPO}\` | \`${SDK_BRANCH}\` |"
            echo "| Wanaku | \`${WANAKU_REPO}\` | \`${WANAKU_BRANCH}\` |"
            echo "| Barn | \`${BARN_REPO}\` | \`${BARN_BRANCH}\` |"
            echo "| CIC | \`${CIC_REPO}\` | \`${CIC_BRANCH}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build SDK
        run: |
          if [ -x source/wanaku-sdk/mvnw ]; then
            source/wanaku-sdk/mvnw -B -DskipTests install -f source/wanaku-sdk/pom.xml
          else
            mvn -B -DskipTests install -f source/wanaku-sdk/pom.xml
          fi

      - name: Build Wanaku Barn
        run: |
          if [ -x source/wanaku-barn/mvnw ]; then
            source/wanaku-barn/mvnw -B -DskipTests install -f source/wanaku-barn/pom.xml
          else
            mvn -B -DskipTests install -f source/wanaku-barn/pom.xml
          fi

      - name: Build Wanaku Server (Rust)
        run: |
          cd source/wanaku
          # Building the evaluator feature runs its build script, which compiles the WASM
          # evaluator actions (via cargo-component) into actions/dist/.
          cargo build -p wanaku-feature-evaluator
          # Debug build: release optimizations make the server build too slow for CI.
          cargo build --bin wanaku-server

          # The evaluator revision tests activate a real WASM action; ensure one is present.
          # The build script normally produces it, but on a cached build it may not rerun, so
          # build a safety action explicitly as a fallback. The action has been renamed over
          # time (safety-warn -> safety-review), so detect it instead of hardcoding a name.
          mkdir -p actions/dist
          WASM=$(find actions/dist -maxdepth 1 -name 'safety_*_action.wasm' | sort | head -1)
          if [ -z "$WASM" ]; then
            echo "WASM action not produced by build script; building it explicitly"
            ACTION_DIR=$(find actions -maxdepth 1 -type d -name 'safety-*' | sort | head -1)
            test -n "$ACTION_DIR" || { echo "::error::No safety-* evaluator action source found"; exit 1; }
            (cd "$ACTION_DIR" && cargo component build --release)
            BUILT=$(find "$ACTION_DIR/target/wasm32-wasip1/release" -maxdepth 1 -name 'safety_*_action.wasm' | sort | head -1)
            test -n "$BUILT" || { echo "::error::Explicit build produced no WASM under $ACTION_DIR"; exit 1; }
            cp "$BUILT" actions/dist/
            WASM=$(find actions/dist -maxdepth 1 -name 'safety_*_action.wasm' | sort | head -1)
          fi
          test -n "$WASM" || { echo "::error::Evaluator WASM action missing in actions/dist"; exit 1; }
          echo "EVAL_WASM=$(pwd)/${WASM}" >> "$GITHUB_ENV"
          echo "Wanaku server binary and evaluator WASM action ready: ${WASM}"

      - name: Build Camel Integration Capability
        run: |
          if [ -x source/camel-integration-capability/mvnw ]; then
            source/camel-integration-capability/mvnw -B -DskipTests package -f source/camel-integration-capability/pom.xml
          else
            mvn -B -DskipTests package -f source/camel-integration-capability/pom.xml
          fi

      - name: Collect artifacts
        run: |
          chmod +x ./.github/scripts/collect-from-source-artifacts.sh
          ./.github/scripts/collect-from-source-artifacts.sh

      - name: Resolve CLI path
        id: cli
        run: |
          CLI_PATH=$(find artifacts -name "wanaku" -path "*/bin/*" -type f 2>/dev/null | head -1)
          if [ -z "$CLI_PATH" ]; then
            CLI_PATH=$(find artifacts -name "quarkus-run.jar" -path "*wanaku-cli*" 2>/dev/null | head -1)
          fi
          if [ -n "$CLI_PATH" ]; then
            chmod +x "$CLI_PATH" 2>/dev/null || true
            echo "path=$(pwd)/${CLI_PATH}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::CLI not found in built artifacts"
          fi

      - name: Build test fixtures
        run: mvn -B -DskipTests package -f fixtures/test-mcp-server/pom.xml

      - name: Run integration tests
        env:
          CLI_PATH: ${{ steps.cli.outputs.path }}
        run: |
          SERVER_BIN="$(pwd)/source/wanaku/target/debug/wanaku-server"
          CIC_JAR=$(find source/camel-integration-capability -name "*-jar-with-dependencies.jar" -path "*/target/*" | head -1)

          EXTRA_OPTS="-Dwanaku.test.server.binary=${SERVER_BIN}"
          if [ -n "$CIC_JAR" ]; then
            EXTRA_OPTS="$EXTRA_OPTS -Dwanaku.test.camel-capability.jar=$(pwd)/${CIC_JAR}"
          fi
          # EVAL_WASM is resolved and exported by the "Build Wanaku Server (Rust)" step.
          if [ -n "$EVAL_WASM" ] && [ -f "$EVAL_WASM" ]; then
            EXTRA_OPTS="$EXTRA_OPTS -Dwanaku.test.evaluator.wasm=${EVAL_WASM}"
          fi
          # Servers built from wanaku-ai/wanaku#1849 register a wanaku_mcp_id filter and expect it
          # in the pipeline; without it they answer MCP initialize with a null id and clients fail
          # to connect. The harness generates its own pipeline (to inject a dynamic MCP port), so we
          # detect whether this server build declares the filter in its default.yaml and, if so,
          # mirror it into the generated pipeline. Older servers omit it and abort on the unknown
          # filter type, so it must never be added unconditionally. The match is anchored to a
          # filter declaration line to avoid matching comments or longer identifiers.
          if grep -qE '^[[:space:]]*-[[:space:]]*filter:[[:space:]]*wanaku_mcp_id[[:space:]]*$' \
              source/wanaku/server/src/default.yaml 2>/dev/null; then
            EXTRA_OPTS="$EXTRA_OPTS -Dwanaku.test.server.mcp-id-filter=true"
          fi
          if [ -n "$CLI_PATH" ]; then
            EXTRA_OPTS="$EXTRA_OPTS -Dwanaku.test.cli.path=$CLI_PATH"
          fi
          mvn -B verify --fail-at-end --file pom.xml $EXTRA_OPTS

      - name: Test summary
        if: always()
        run: ./.github/scripts/test-summary.sh test-summary-output.md

      - name: Resolve source repo name
        if: always() && env.PR_NUMBER != ''
        id: source
        run: |
          REPO_NAME="${SOURCE_REPO#*/}"
          if [ -z "$REPO_NAME" ] || [ "$REPO_NAME" = "$SOURCE_REPO" ]; then
            echo "::error::Invalid source_repo format '${SOURCE_REPO}' — expected 'owner/repo'"
            exit 1
          fi
          echo "repo_name=${REPO_NAME}" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        if: always() && env.PR_NUMBER != ''
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.INTEGRATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.INTEGRATION_APP_PRIVATE_KEY }}
          owner: wanaku-ai
          repositories: ${{ steps.source.outputs.repo_name }}

      - name: Post test summary to PR
        if: always() && env.PR_NUMBER != '' && steps.app-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          MARKER="<!-- integration-test-results -->"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          {
            echo "${MARKER}"
            echo "## Integration Test Results"
            echo ""
            echo "> **Run:** [${RUN_URL}](${RUN_URL})"
            echo "> **Wanaku:** \`${WANAKU_REPO}\` @ \`${WANAKU_BRANCH}\`"
            echo ""
            if [ -f test-summary-output.md ]; then
              cat test-summary-output.md
            else
              echo "_Test summary not available._"
            fi
          } > pr-comment.md

          EXISTING=$(gh api --paginate "repos/${SOURCE_REPO}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | startswith(\"${MARKER}\")) | .id" | head -1)

          if [ -n "$EXISTING" ]; then
            gh api "repos/${SOURCE_REPO}/issues/comments/${EXISTING}" \
              -X PATCH -F "body=@pr-comment.md"
          else
            gh api "repos/${SOURCE_REPO}/issues/${PR_NUMBER}/comments" \
              -F "body=@pr-comment.md"
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-integration-test-reports
          path: |
            **/target/failsafe-reports/
            **/target/logs/
          retention-days: 14
          if-no-files-found: ignore

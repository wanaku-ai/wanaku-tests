name: Saci Worker Container

on:
  pull_request:
    paths:
      - saci/**
      - .github/workflows/saci-container.yml
      - build-manifests.sh
  push:
    branches: [main]
    paths:
      - saci/**
      - .github/workflows/saci-container.yml
      - build-manifests.sh
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: quay.io/wanaku/wanaku-saci-worker

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            architecture: amd64
          - os: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.os }}
    env:
      IMAGE_REF: ${{ format('quay.io/wanaku/wanaku-saci-worker:sha-{0}-{1}', github.sha, matrix.architecture) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build container
        run: docker build -f saci/Containerfile -t "$IMAGE_REF" saci
      - name: Check the server and the CLI
        run: |
          docker run --rm --user 123456:0 --entrypoint bash "$IMAGE_REF" -c '
            set -eu
            wanaku --version
            wanaku-server >wanaku-server.log 2>&1 &
            for _ in $(seq 1 50); do
              curl -fsS -o /dev/null http://127.0.0.1:8080/healthz && break
              sleep 0.2
            done
            curl -fsS http://127.0.0.1:8080/healthz || { cat wanaku-server.log; exit 1; }
            wanaku tools list --no-auth'
      - name: Login to Container Registry
        if: github.event_name != 'pull_request' && github.repository == 'wanaku-ai/wanaku-tests' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - name: Push container
        if: github.event_name != 'pull_request' && github.repository == 'wanaku-ai/wanaku-tests' && github.ref == 'refs/heads/main'
        run: docker push "$IMAGE_REF"

  create-manifests:
    if: github.event_name != 'pull_request' && github.repository == 'wanaku-ai/wanaku-tests' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - name: Create and verify multi-architecture manifests
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: bash ./build-manifests.sh "$IMAGE" "$IMAGE_TAG"
